name: CI

# main 푸시 / PR 에서 빌드가 깨지지 않는지 확인 (태그 배포 전 안전망)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Smoke test (인증 없이 되는 것만)
        run: |
          node dist/sync.js --version
          node dist/sync.js --help
