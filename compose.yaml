services:
  web:
    build: .
    image: confluence-sync-web:local
    ports:
      - "${CSYNC_WEB_PORT:-8080}:8080"
    environment:
      CSYNC_PUBLIC_URL: "${CSYNC_PUBLIC_URL:-}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777,size=1073741824
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
